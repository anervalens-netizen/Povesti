services:
  povesti:
    build: .
    container_name: povesti-studio
    env_file: .env
    environment:
      APP_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ./stories:/app/stories
      - ./media:/app/media
      - ./data:/app/data
      - ./voices:/app/voices:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/', timeout=3).read(1)"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped
