name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Capture Higgs audit
        run: python scripts/validate_stories.py > higgs-audit.txt
      - name: Upload Higgs audit
        uses: actions/upload-artifact@v4
        with:
          name: higgs-audit
          path: higgs-audit.txt
      - run: python scripts/validate_stories.py --strict-quality
      - run: python scripts/preview_higgs_payload.py alexandru-marele-garaj-fermecat --scene covorul --segment 1
      - run: pytest -q
      - run: node --check app/static/app.js
      - run: node tests/test_player.js
