{% extends "base.html" %}{% block title %}Poveste nouă{% endblock %}
{% block content %}<section class="form-shell"><p class="eyebrow">ATELIER</p><h1>Generează o poveste nouă</h1><p>Necesită LLM_PROVIDER configurat. Rezultatul este salvat ca draft și trebuie verificat de un adult.</p>
<form id="generate-form"><label>Ideea poveștii<textarea name="title_idea" required>Alexandru și mașinuța care se grăbea mereu</textarea></label><label>Lecția<textarea name="lesson" required>Să aibă răbdare și să nu se enerveze când ceva nu reușește din prima.</textarea></label><label>Elemente preferate<textarea name="favorite_elements">mașinuțe de curse, Tati, un garaj fermecat, umor, sunete de motor</textarea></label><div class="row"><label>Vârsta<input type="number" name="age" value="3" min="2" max="10"></label><label>Minute<input type="number" name="estimated_minutes" value="7" min="3" max="15"></label><label>Alegeri<input type="number" name="choices" value="2" min="1" max="4"></label></div><button class="button" type="submit">Generează draftul</button></form><pre id="generate-result"></pre></section>{% endblock %}
