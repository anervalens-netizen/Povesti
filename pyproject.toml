[project]
name = "povesti-studio"
version = "0.2.0"
description = "Studio local-first pentru povești interactive audio, pregătit pentru Higgs TTS 3"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "jinja2>=3.1,<4",
  "httpx>=0.28,<1",
  "openai>=1.60,<4",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
